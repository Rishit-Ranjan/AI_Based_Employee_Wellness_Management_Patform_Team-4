services:
  - type: web
    name: employee-wellness-platform
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend/src --workers 1 --timeout 120 --max-requests 1000 --max-requests-jitter 100 --bind 0.0.0.0:$PORT flask_app:app
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: employee_wellness_analytics
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: AI_MODEL_NAME
        value: qwen3:1.7b
